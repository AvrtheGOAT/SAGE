  <script>
    (function(){var b=document.getElementById('theme-toggle');if(!b)return;var i=document.getElementById('theme-icon');
      function draw(){var dark=document.documentElement.getAttribute('data-theme')==='dark';var l=dark?'Switch to light theme':'Switch to dark theme';b.setAttribute('aria-label',l);b.title=l;i.textContent=dark?'light_mode':'dark_mode'}
      b.addEventListener('click',function(){var t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('sage-theme',t)}catch(e){}draw();document.dispatchEvent(new CustomEvent('sage:theme'))});draw()})();
  </script>
