{#- Shared <head> for the public pages. Before including, set: title, description, path, and optionally noindex. -#}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  {%- if noindex %}
  <meta name="robots" content="noindex, nofollow">
  {%- else %}
  <link rel="canonical" href="{{ site_url }}{{ path }}">
  {%- endif %}
  <meta name="theme-color" content="#f4faf7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#070f0d" media="(prefers-color-scheme: dark)">

  <!-- Open Graph and social cards -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SAGE">
  <meta property="og:locale" content="en_IN">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ site_url }}{{ path }}">
  <meta property="og:image" content="{{ site_url }}/static/og/sage-og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="SAGE: a wristband and family dashboard. Care that stays close, even from afar.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ title }}">
  <meta name="twitter:description" content="{{ description }}">
  <meta name="twitter:image" content="{{ site_url }}/static/og/sage-og.png">

{% include "partials/icons.html" %}

  <script>(function(){var t=null;try{t=localStorage.getItem("sage-theme")}catch(e){}
    if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
    document.documentElement.setAttribute("data-theme",t)})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,300..400,0..1&display=block" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/sage.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/site.css') }}" rel="stylesheet">
